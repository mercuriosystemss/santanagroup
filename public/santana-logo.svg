<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C4A676;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B7355;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Outer circles -->
  <circle cx="50" cy="50" r="48" fill="none" stroke="currentColor" stroke-width="1" opacity="0.3"/>
  <circle cx="50" cy="50" r="42" fill="none" stroke="currentColor" stroke-width="0.5" opacity="0.5"/>

  <!-- Main design -->
  <g opacity="0.95">
    <!-- Center circle -->
    <circle cx="50" cy="30" r="6" fill="currentColor"/>
    <circle cx="50" cy="30" r="11" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <circle cx="50" cy="30" r="16" fill="none" stroke="currentColor" stroke-width="0.8" opacity="0.6"/>

    <!-- Wood elements -->
    <path d="M35 45 L50 35 L65 45 L50 55 Z" fill="currentColor" opacity="0.8"/>
    <path d="M35 60 L50 50 L65 60 L50 70 Z" fill="currentColor" opacity="0.9"/>
  </g>

  <!-- Text -->
  <text x="50" y="88" font-family="serif" font-size="9" font-weight="700" fill="currentColor" text-anchor="middle" letter-spacing="1">RDSS</text>
  <text x="50" y="96" font-family="sans-serif" font-size="5" fill="currentColor" text-anchor="middle" letter-spacing="2" opacity="0.8">SANTANA GROUP</text>
