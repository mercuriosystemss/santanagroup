<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C4A676;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B7355;stop-opacity:1" />
    </linearGradient>
    <filter id="woodGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Outer circles with gradient -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="url(#woodGrad)" stroke-width="2" opacity="0.4"/>
  <circle cx="100" cy="100" r="85" fill="none" stroke="url(#woodGrad)" stroke-width="1.5" opacity="0.6"/>

  <!-- Main design -->
  <g opacity="0.95" filter="url(#woodGlow)">
    <!-- Center sphere -->
    <circle cx="100" cy="65" r="12" fill="#C4A676"/>
    <circle cx="100" cy="65" r="18" fill="none" stroke="#C4A676" stroke-width="2.5"/>
    <circle cx="100" cy="65" r="26" fill="none" stroke="#C4A676" stroke-width="1.5" opacity="0.6"/>

    <!-- Wood geometric elements -->
    <path d="M70 95 L100 75 L130 95 L100 115 Z" fill="#8B7355" opacity="0.85"/>
    <path d="M70 130 L100 110 L130 130 L100 150 Z" fill="#6B5745" opacity="0.9"/>

    <!-- Center detail -->
    <circle cx="100" cy="100" r="12" fill="#2C2416" opacity="0.8"/>
  </g>

  <!-- Text labels -->
  <text x="100" y="175" font-family="serif" font-size="16" font-weight="700" fill="currentColor" text-anchor="middle" letter-spacing="2">RDSS</text>
  <text x="100" y="192" font-family="sans-serif" font-size="10" fill="currentColor" text-anchor="middle" letter-spacing="3" opacity="0.8">WOOD DESIGN</text>
</svg>
